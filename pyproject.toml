[project]
name = "asset-autopsy"
version = "0.0.0"
description = "Tools-first 3D asset repair harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==1.26.0",
    "mujoco==3.5.0",
    "mujoco-mcp-server @ git+https://github.com/Rongxuan-Zhou/mujoco-mcp-server.git@ce9bed80ec3698d7b778230abc21f2228a3ce94b",
    "openai-agents",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
test = [
    "pytest==8.4.1",
    "ruff==0.15.4",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
openai-agents = { git = "https://github.com/openai/openai-agents-python.git", rev = "89c02c828ee8510fe9a84ee6675608193aa13b02" }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_autopsy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cgl: requires a CGL-capable real Mac with a working MuJoCo renderer",
    "upstream_live: requires the pinned local MuJoCo MCP stdio server",
]
